name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start fresh local Supabase
        run: supabase start
        env:
          GITHUB_CLIENT_SECRET: ci-not-used

      - name: Verify migrations and development seed from zero
        run: supabase db reset
        env:
          GITHUB_CLIENT_SECRET: ci-not-used

      - name: pgTAP database tests
        run: supabase test db

      - name: Supabase integration tests
        run: npm run test:integration
